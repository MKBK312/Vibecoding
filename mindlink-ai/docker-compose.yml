version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mindlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mindlink
      MYSQL_USER: ${MYSQL_USER:-mindlink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mindlink123}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mindlink-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-mindlink}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mindlink123}
      - MYSQL_DB=mindlink
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
    volumes:
      - chroma_data:/data/chroma
      - uploads_data:/uploads
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://${LAN_IP}:8000
    container_name: mindlink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  chroma_data:
  uploads_data:
